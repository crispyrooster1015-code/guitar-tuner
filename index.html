<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guitar Tuner</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceff1;--panel:#fff;--ink:#1b2024;--mute:#5d6870;--line:#cfd6db;--brass:#8a6a22;--ok:#1f8a5b;--warn:#c4462f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17191c;--panel:#21252a;--ink:#eef0f2;--mute:#9aa5ad;--line:#343a41;--brass:#d2ab5e;--ok:#5fcf9a;--warn:#ff7a62;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17191c;--panel:#21252a;--ink:#eef0f2;--mute:#9aa5ad;--line:#343a41;--brass:#d2ab5e;--ok:#5fcf9a;--warn:#ff7a62;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:440px;padding:20px 18px 28px;display:flex;flex-direction:column;gap:18px}
h1{font-size:1rem;font-weight:500;margin:0;color:var(--mute)}
.display{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 18px 20px;text-align:center}
.note{font-size:7.5rem;font-weight:800;line-height:1;letter-spacing:-.04em;transition:color .15s}
.note sub{font-size:2rem;font-weight:500;letter-spacing:0;color:var(--mute);vertical-align:baseline;margin-left:2px}
.status{font-size:1.1rem;min-height:1.6em;margin-top:6px;font-weight:500}
.hz{color:var(--mute);font-size:.9rem;margin-top:2px;font-variant-numeric:tabular-nums}
.gauge{position:relative;height:64px;margin:18px 6px 0}
.gauge .track{position:absolute;left:0;right:0;top:50%;height:2px;background:var(--line)}
.gauge .tick{position:absolute;top:30%;width:1px;height:40%;background:var(--line)}
.gauge .zone{position:absolute;left:46%;width:8%;top:18%;height:64%;border-radius:8px;background:var(--ok);opacity:.18}
.needle{position:absolute;top:6%;left:50%;width:4px;height:88%;margin-left:-2px;border-radius:2px;background:var(--mute);transition:left .12s linear,background .15s}
.scale{display:flex;justify-content:space-between;color:var(--mute);font-size:.8rem;margin:2px 6px 0}
.strings{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.strings button{font:inherit;font-size:1.35rem;font-weight:800;padding:14px 0;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.strings button small{display:block;font-size:.7rem;font-weight:500;color:var(--mute)}
.strings button[aria-pressed="true"]{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.strings button.hit{background:var(--ok);color:#fff;border-color:var(--ok)}
.strings button.hit small{color:#fff}
.go{font:inherit;font-weight:800;font-size:1.1rem;padding:16px;border-radius:14px;border:0;background:var(--brass);color:#fff;cursor:pointer}
:root:not([data-theme="light"]) .go{color:#17191c}
.go[data-on="true"]{background:transparent;color:var(--ink);border:1px solid var(--line)}
.hint{color:var(--mute);font-size:.85rem;margin:0;line-height:1.45}
.go.mic{background:transparent;color:var(--ink);border:1px solid var(--brass);margin-bottom:-8px}
:root:not([data-theme="light"]) .go.mic{color:var(--ink)}
.go.mic.ok{border-color:var(--ok);color:var(--ok)}
button:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.in .note{color:var(--ok)}.in .needle{background:var(--ok)}
.off .needle{background:var(--warn)}
</style>
</head>
<body>
<main>
<h1>Nylon-string guitar · E A D G B E</h1>
<section class="display" id="disp" aria-live="polite">
  <div class="note" id="note">–</div>
  <div class="status" id="status">Tap Start, then pluck a string</div>
  <div class="hz" id="hz">&nbsp;</div>
  <div class="gauge" aria-hidden="true">
    <div class="track"></div><div class="zone"></div>
    <div class="tick" style="left:0"></div><div class="tick" style="left:25%"></div>
    <div class="tick" style="left:50%;height:60%;top:20%"></div>
    <div class="tick" style="left:75%"></div><div class="tick" style="left:100%"></div>
    <div class="needle" id="needle"></div>
  </div>
  <div class="scale" aria-hidden="true"><span>Flat</span><span>In tune</span><span>Sharp</span></div>
</section>
<button class="go mic" id="mic" type="button">🎤 Allow microphone</button>
<button class="go" id="go" data-on="false">Start tuning</button>
<div>
  <div class="strings" id="strings"></div>
  <p class="hint" style="margin-top:10px">Tap a string to hear its pitch and lock the tuner to it. Tap it again to go back to automatic detection.</p>
</div>
<p class="hint" id="msg"></p>
</main>
<script>
(function(){
var S=[{n:'E',o:2,f:82.41,s:6},{n:'A',o:2,f:110,s:5},{n:'D',o:3,f:146.83,s:4},{n:'G',o:3,f:196,s:3},{n:'B',o:3,f:246.94,s:2},{n:'E',o:4,f:329.63,s:1}];
var $=function(i){return document.getElementById(i)};
var ctx,analyser,stream,raf,buf,lock=-1,running=false,smooth=null,lastGood=0;
var strEl=$('strings');
S.forEach(function(s,i){
  var b=document.createElement('button');b.type='button';b.setAttribute('aria-pressed','false');
  b.innerHTML=s.n+'<small>String '+s.s+'</small>';
  b.setAttribute('aria-label','String '+s.s+', '+s.n+s.o);
  b.onclick=function(){
    lock=(lock===i)?-1:i;
    [].forEach.call(strEl.children,function(c,j){c.setAttribute('aria-pressed',j===lock?'true':'false')});
    if(lock>=0)tone(s.f);
  };
  strEl.appendChild(b);
});
function audio(){if(!ctx){var C=window.AudioContext||window.webkitAudioContext;ctx=new C();}if(ctx.state==='suspended')ctx.resume();return ctx}
function tone(f){
  try{var c=audio(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;
  o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.3,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+2);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+2.1);}catch(e){}
}
function detect(b,sr){
  var N=2048,rms=0,i,lag;
  for(i=0;i<N;i++)rms+=b[i]*b[i];
  rms=Math.sqrt(rms/N);if(rms<0.004)return -1;
  var min=Math.floor(sr/400),max=Math.floor(sr/65),c=new Float32Array(max+2),best=0;
  for(lag=min-1;lag<=max+1;lag++){
    var sum=0,e1=0,e2=0;
    for(i=0;i<N;i++){var a=b[i],d=b[i+lag];sum+=a*d;e1+=a*a;e2+=d*d}
    c[lag]=sum/Math.sqrt(e1*e2+1e-9);
    if(lag>=min&&lag<=max&&c[lag]>best)best=c[lag];
  }
  if(best<0.8)return -1;
  for(lag=min;lag<=max;lag++){
    if(c[lag]>=best*0.92&&c[lag]>=c[lag-1]&&c[lag]>=c[lag+1]){
      var y1=c[lag-1],y2=c[lag],y3=c[lag+1],den=y1-2*y2+y3,sh=den?0.5*(y1-y3)/den:0;
      return sr/(lag+sh);
    }
  }
  return -1;
}
function cents(f,t){return 1200*Math.log2(f/t)}
function nearest(f){
  if(lock>=0)return lock;
  var bi=0,bd=1e9;
  S.forEach(function(s,i){var d=Math.abs(cents(f,s.f));if(d<bd){bd=d;bi=i}});
  return bi;
}
function show(idx,f,cts){
  var s=S[idx],ok=Math.abs(cts)<=5,disp=$('disp');
  $('note').innerHTML=s.n+'<sub>'+s.o+'</sub>';
  $('hz').textContent=f.toFixed(1)+' Hz · target '+s.f.toFixed(1)+' Hz';
  var clamp=Math.max(-50,Math.min(50,cts));
  $('needle').style.left=(50+clamp)+'%';
  disp.className='display '+(ok?'in':(Math.abs(cts)>25?'off':''));
  $('status').textContent=ok?'In tune':(cts<0?'Too low · tighten the string':'Too high · loosen the string');
  [].forEach.call(strEl.children,function(c,j){c.classList.toggle('hit',ok&&j===idx)});
}
function idle(){
  if(performance.now()-lastGood>900){
    smooth=null;$('disp').className='display';$('needle').style.left='50%';
    $('note').textContent='–';$('hz').innerHTML='&nbsp;';
    $('status').textContent='Listening… pluck a string';
    [].forEach.call(strEl.children,function(c){c.classList.remove('hit')});
  }
}
function loop(){
  if(!running)return;
  analyser.getFloatTimeDomainData(buf);
  var f=detect(buf,ctx.sampleRate);
  if(f>0){
    lastGood=performance.now();
    smooth=smooth==null||Math.abs(cents(f,smooth))>80?f:smooth*.7+f*.3;
    var i=nearest(smooth);show(i,smooth,cents(smooth,S[i].f));
  }else idle();
  raf=requestAnimationFrame(loop);
}
function stop(){
  running=false;cancelAnimationFrame(raf);
  if(stream)stream.getTracks().forEach(function(t){t.stop()});stream=null;
  $('go').textContent='Start tuning';$('go').dataset.on='false';
  $('status').textContent='Tap Start, then pluck a string';
  $('disp').className='display';$('needle').style.left='50%';$('note').textContent='–';$('hz').innerHTML='&nbsp;';
}
$('mic').onclick=async function(){
  var b=$('mic'),m=$('msg');m.textContent='';
  try{
    var st=await navigator.mediaDevices.getUserMedia({audio:true});
    st.getTracks().forEach(function(t){t.stop()});
    b.textContent='✓ Microphone allowed';b.classList.add('ok');
    m.textContent='Now tap Start tuning and pluck a string.';
  }catch(e){
    b.textContent='🎤 Try microphone again';b.classList.remove('ok');
    m.textContent='Microphone blocked ('+(e&&e.name?e.name:'unknown error')+'). If you opened this inside the Claude app or its preview, the viewer may not allow microphone access. Open the page on its own HTTPS link instead.';
  }
};
$('go').onclick=async function(){
  if(running){stop();return}
  var m=$('msg');m.textContent='';
  try{
    var c=audio();
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    var src=c.createMediaStreamSource(stream);
    analyser=c.createAnalyser();analyser.fftSize=4096;src.connect(analyser);
    buf=new Float32Array(analyser.fftSize);
    running=true;$('go').textContent='Stop';$('go').dataset.on='true';
    $('status').textContent='Listening… pluck a string';
    loop();
  }catch(e){
    m.textContent='The microphone isn’t available ('+(e&&e.name?e.name:'unknown error')+'). If you opened this inside an app, open the link in your phone’s browser (Safari or Chrome) and allow the microphone when asked. You can still tap a string to hear its pitch and tune by ear.';
  }
};
})();
</script>
</body>
</html>
